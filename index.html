<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Курс</title>
    <script>
        // Anti-FOUC: применяем тему до первой отрисовки
        (function() {
            try {
                var t = localStorage.getItem("kp_course_theme");
                if (t === "dark" || t === "light") {
                    document.documentElement.setAttribute("data-theme", t);
                } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            } catch (e) {}
        })();
    </script>
    <style>
        /* ===== Локальные шрифты ===== */
        @font-face {
            font-family: 'M PLUS Rounded 1c';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('fonts/MPLUSRounded1c-Regular.ttf') format('truetype');
        }
        @font-face {
            font-family: 'M PLUS Rounded 1c';
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url('fonts/MPLUSRounded1c-Medium.ttf') format('truetype');
        }
        @font-face {
            font-family: 'M PLUS Rounded 1c';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('fonts/MPLUSRounded1c-Bold.ttf') format('truetype');
        }
        @font-face {
            font-family: 'M PLUS Rounded 1c';
            font-style: normal;
            font-weight: 800;
            font-display: swap;
            src: url('fonts/MPLUSRounded1c-ExtraBold.ttf') format('truetype');
        }

        :root {
            --font-body: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            --font-mono: ui-monospace, Menlo, Consolas, 'Courier New', monospace;

            --bg: #F5F0E6;
            --bg-soft: #EBE4D4;
            --card-bg: #FAF6EC;
            --card-border: #E0D6C0;

            --text: #1A1A1A;
            --text-strong: #000000;
            --text-muted: #6B6256;
            --text-disabled: #A89E8C;
            --text-soft: #4A4540;

            --primary: #0D5C4F;
            --primary-hover: #0A4A40;
            --primary-soft: #D4E4DF;

            --secondary: #8B1A2B;
            --secondary-soft: #F0D8DC;

            --success: #2D6A4F;
            --success-bg: #D4E8DC;
            --success-soft: #D4E8DC;
            --success-border: #2D6A4F;

            --error: #C83B3B;
            --error-bg: #F5D4D4;
            --error-soft: #F5D4D4;
            --error-border: #C83B3B;

            --warning-bg: #F0D8DC;
            --warning-text: #8B1A2B;

            --border: #D8CEB8;
            --hover: #E8DCC8;
            --hover-strong: #DDD0B8;

            --input-bg: #EBE4D4;
            --input-bg-focus: #FAF6EC;

            --topbar-bg: #FAF6EC;
            --topbar-text: #1A1A1A;
            --topbar-border: #E0D6C0;

            --media-bg: #0D1416;
            --card-face-bg: #F0E8D8;
            --card-face-text: #1A1A1A;
            --placeholder-bg: #EBE4D4;
            --placeholder-border: #D8CEB8;
            --placeholder-text: #A89E8C;

            --nav-current: #2563EB;
            --nav-current-soft: rgba(37, 99, 235, 0.15);
            --memo-accent: #4A6FA5;
            --memo-accent-soft: #DEE7F2;

            --shadow-sm: 0 1px 2px rgba(43,43,43,.08);
            --shadow-md: 0 4px 12px rgba(43,43,43,.10);
            --shadow-lg: 0 10px 30px rgba(43,43,43,.14);

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }
        [data-theme="dark"] {
            --bg: #0D1416;
            --bg-soft: #1A2528;
            --card-bg: #152024;
            --card-border: #2A3A3E;

            --text: #F5E6C8;
            --text-strong: #FFF5DC;
            --text-muted: #A89A78;
            --text-disabled: #6B6256;
            --text-soft: #C9B896;

            --primary: #3A8A7A;
            --primary-hover: #4A9E8C;
            --primary-soft: #1F3A35;

            --secondary: #D95A1A;
            --secondary-soft: #3A2520;

            --success: #52B788;
            --success-bg: #1F3A2A;
            --success-soft: #1F3A2A;
            --success-border: #52B788;

            --error: #E63946;
            --error-bg: #3A1F22;
            --error-soft: #3A1F22;
            --error-border: #E63946;

            --warning-bg: #3A2520;
            --warning-text: #D95A1A;

            --border: #2A3A3E;
            --hover: #1F3A3A;
            --hover-strong: #2A4A4A;

            --input-bg: #1A2528;
            --input-bg-focus: #152024;

            --topbar-bg: #152024;
            --topbar-text: #F5E6C8;
            --topbar-border: #2A3A3E;

            --media-bg: #000000;
            --card-face-bg: #EBE4D4;
            --card-face-text: #1A1A1A;
            --placeholder-bg: #1A2528;
            --placeholder-border: #2A3A3E;
            --placeholder-text: #6B6256;

            --nav-current: #60A5FA;
            --nav-current-soft: rgba(96, 165, 250, 0.25);
            --memo-accent: #6B8FC5;
            --memo-accent-soft: #1E2A3A;

            --shadow-sm: 0 1px 2px rgba(0,0,0,.30);
            --shadow-md: 0 4px 12px rgba(0,0,0,.40);
            --shadow-lg: 0 10px 30px rgba(0,0,0,.50);
        }

        * { box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            font-weight: 400;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px;
            transition: background-color .25s, color .25s;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.01em;
            line-height: 1.6;
        }

        h1, h2, h3 { font-weight: 700; letter-spacing: 0.02em; }

        .app-container {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .app-container.wide {
            max-width: 1400px;
        }

        .screen { display: none; }
        .screen.active { display: flex; flex-direction: column; gap: 16px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: box-shadow .2s;
        }
        .card-body { padding: 32px 40px; }
        @media (max-width: 600px) {
            .card-body { padding: 24px 20px; }
            .lesson-header { gap: 10px; }
            .lesson-title { font-size: 16px; }
            .header-right { gap: 6px; flex-wrap: wrap; }
            .timer { font-size: 13px; padding: 4px 10px; }
            .btn-icon { width: 36px; height: 36px; font-size: 16px; }
            .btn-text { padding: 8px 10px; font-size: 13px; }
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }
        .screen-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-strong);
            margin: 0 0 8px;
            line-height: 1.2;
            letter-spacing: -.3px;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .screen-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.5;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            letter-spacing: .1px;
            cursor: pointer;
            border: none;
            transition: all .15s;
            white-space: nowrap;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); box-shadow: var(--shadow-sm); }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--border);
        }
        .btn-outline:hover { background: var(--primary-soft); border-color: transparent; }
        .btn-text {
            background: transparent;
            color: var(--text-muted);
            padding: 10px 16px;
        }
        .btn-text:hover { background: var(--hover); color: var(--text); }
        .btn-icon {
            width: 42px;
            height: 42px;
            padding: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all .15s;
            font-family: inherit;
        }
        .btn-icon:hover { background: var(--hover); color: var(--text); }
        .btn:disabled { opacity: .4; cursor: default; pointer-events: none; }

        /* ===== Меню ===== */
        .menu-list { display: flex; flex-direction: column; gap: 12px; }
        .menu-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: 24px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            transition: box-shadow .2s;
            border-left: 6px solid var(--card-border);
        }
        .menu-item:hover { box-shadow: var(--shadow-md); }
        .menu-item.theory { border-left-color: var(--secondary); }
        .menu-item.quiz { border-left-color: var(--primary); }
        .menu-item.memo { border-left-color: var(--memo-accent); }

        .menu-info { flex: 1; min-width: 200px; }
        .menu-info h3 {
            margin: 0 0 6px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-strong);
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.3;
        }
        .menu-info p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .menu-type-badge {
            display: inline-block;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .menu-type-badge.theory {
            background: var(--secondary-soft);
            color: var(--secondary);
        }
        .menu-type-badge.quiz {
            background: var(--primary-soft);
            color: var(--primary);
        }
        .menu-type-badge.memo {
            background: var(--memo-accent-soft);
            color: var(--memo-accent);
        }
        .menu-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .progress-bar {
            height: 8px;
            background: var(--hover);
            border-radius: 100px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            border-radius: 100px;
            transition: width .4s ease;
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .lesson-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-strong);
        }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .timer {
            font-weight: 600;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            font-size: 15px;
            padding: 6px 14px;
            background: var(--hover);
            border-radius: 100px;
        }

        .lesson-layout, .quiz-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .lesson-main, .quiz-main { flex: 1; min-width: 0; }
        .lesson-sidebar, .quiz-sidebar {
            width: 240px;
            flex-shrink: 0;
            position: sticky;
            top: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: 20px;
        }
        .lesson-sidebar h3, .quiz-sidebar h3 {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .8px;
            margin: 0 0 14px;
            font-weight: 700;
        }

        .topic-list { display: flex; flex-direction: column; gap: 4px; }
        .topic-item {
            text-align: left;
            padding: 10px 14px;
            border: none;
            background: transparent;
            color: var(--text);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            transition: all .15s;
            line-height: 1.4;
        }
        .topic-item:hover { background: var(--hover); }
        .topic-item.current {
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 700;
        }
        .topic-item.visited { color: var(--success); }
        .topic-item.visited.current { color: var(--primary); }

        .slide-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 24px;
            color: var(--text-strong);
            line-height: 1.3;
            letter-spacing: -.2px;
        }

        .slide-content p {
            font-size: 16px;
            line-height: 1.7;
            margin: 0 0 16px;
            color: var(--text);
        }
        .slide-content h3 {
            font-size: 18px;
            font-weight: 700;
            margin: 28px 0 12px;
            color: var(--text-strong);
        }
        .slide-content ul { margin: 0 0 16px; padding-left: 24px; }
        .slide-content ul li {
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 8px;
            color: var(--text);
        }
        .slide-content .quote {
            margin: 24px 0;
            padding: 16px 22px;
            background: var(--secondary-soft);
            border-left: 4px solid var(--secondary);
            border-radius: var(--radius-sm);
            font-size: 15px;
            line-height: 1.6;
            color: var(--text);
        }
        .slide-content strong { color: var(--text-strong); font-weight: 700; }

        .slide-media { margin: 24px 0; }
        .slide-media img,
        .slide-media video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: var(--radius-md);
            background: var(--media-bg);
        }
        .slide-media video { max-height: 520px; }

        .slide-media-error {
            padding: 30px 20px;
            text-align: center;
            background: var(--placeholder-bg);
            border: 1px dashed var(--placeholder-border);
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }
        .slide-media-error code {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--primary);
            word-break: break-all;
        }

        .link-block { margin: 20px 0; }
        .slide-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: var(--secondary-soft);
            color: var(--secondary);
            border-radius: 100px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all .2s;
            border: none;
            font-family: inherit;
        }
        .slide-link:hover { background: var(--secondary); color: #fff; }
        .slide-link.internal { background: var(--primary-soft); color: var(--primary); }
        .slide-link.internal:hover { background: var(--primary); color: #fff; }

        .nav-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        .nav-btn {
            padding: 12px 28px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--primary);
            transition: all .2s;
        }
        .nav-btn:hover:not(:disabled) { background: var(--primary-soft); border-color: transparent; }
        .nav-btn:disabled { opacity: .35; cursor: default; }
        .nav-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .nav-btn.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }

        .quiz-nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .quiz-nav-num {
            aspect-ratio: 1;
            padding: 0;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all .15s;
        }
        .quiz-nav-num:hover { background: var(--hover); color: var(--text); }
        .quiz-nav-num.correct { background: var(--success-bg); border-color: var(--success-border); color: var(--success); }
        .quiz-nav-num.wrong { background: var(--error-bg); border-color: var(--error-border); color: var(--error); }
        .quiz-nav-num.current { border-color: var(--nav-current); color: var(--nav-current); box-shadow: 0 0 0 2px var(--nav-current-soft); }

        .quiz-question-text {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
            color: var(--text-strong);
        }
        .quiz-hint {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-style: italic;
        }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; }
        .quiz-opt {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            font-weight: 400;
            font-family: inherit;
            transition: all .15s;
            line-height: 1.4;
        }
        .quiz-opt:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
        .quiz-opt:disabled { cursor: default; }
        .quiz-opt.selected { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 500; }
        .quiz-opt.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); font-weight: 500; }
        .quiz-opt.wrong { background: var(--error-bg); border-color: var(--error); color: var(--error); }

        .quiz-explain {
            display: none;
            margin-top: 20px;
            padding: 18px 22px;
            background: var(--secondary-soft);
            border-left: 4px solid var(--secondary);
            border-radius: var(--radius-sm);
            font-size: 15px;
            line-height: 1.6;
            color: var(--text);
        }
        .quiz-explain.show { display: block; animation: fadeIn .3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .quiz-nav-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        .quiz-nav-btn {
            padding: 12px 28px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--primary);
            transition: all .2s;
        }
        .quiz-nav-btn:hover:not(:disabled) { background: var(--primary-soft); border-color: transparent; }
        .quiz-nav-btn:disabled { opacity: .35; cursor: default; }
        .quiz-nav-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .quiz-nav-btn.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
        .quiz-nav-btn.check {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }
        .quiz-nav-btn.check:hover:not(:disabled) { filter: brightness(.9); }

        /* ===== MATCH ===== */
        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 8px;
        }
        .match-col { display: flex; flex-direction: column; gap: 8px; }
        .match-item {
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--card-bg);
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: all .18s;
            line-height: 1.4;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .match-item:hover:not(.matched):not(:disabled) {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
        }
        .match-item.selected {
            border-color: var(--nav-current);
            background: var(--nav-current-soft);
            color: var(--nav-current);
            font-weight: 700;
        }
        .match-item.matched {
            border-color: var(--success);
            background: var(--success-bg);
            color: var(--success);
            cursor: default;
            font-weight: 700;
        }
        .match-item.wrong-flash {
            border-color: var(--error);
            background: var(--error-bg);
            color: var(--error);
            animation: shake .4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .match-counter {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 14px;
            font-weight: 500;
        }
        @media (max-width: 600px) {
            .match-grid { gap: 8px; }
            .match-item { padding: 10px 8px; font-size: 14px; min-height: 48px; }
        }

        /* ===== CARD ===== */
        .card-view {
            max-width: 560px;
            margin: 0 auto;
        }
        .card-face {
            background: var(--card-face-bg);
            color: var(--card-face-text);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 60px 30px;
            text-align: center;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }
        .card-face-image {
            max-width: 100%;
            max-height: 240px;
            border-radius: var(--radius-sm);
            object-fit: contain;
        }
        .card-face-text {
            font-size: 40px;
            font-weight: 700;
            line-height: 1.2;
            word-break: break-word;
        }
        @media (max-width: 600px) {
            .card-face { padding: 40px 20px; min-height: 220px; }
            .card-face-text { font-size: 30px; }
        }
        .card-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .card-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--card-bg);
            color: var(--text-muted);
            font-size: 34px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
            font-family: inherit;
            line-height: 1;
            user-select: none;
        }
        .card-btn.dontknow { border-color: var(--error); color: var(--error); }
        .card-btn.dontknow:hover { background: var(--error-bg); transform: scale(1.05); }
        .card-btn.know { border-color: var(--success); color: var(--success); }
        .card-btn.know:hover { background: var(--success-bg); transform: scale(1.05); }
        .card-btn:disabled { opacity: .4; cursor: default; pointer-events: none; }
        @media (max-width: 600px) {
            .card-btn { width: 76px; height: 76px; font-size: 28px; }
        }

        .card-answer-label {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .8px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* ===== РЕЗУЛЬТАТ ===== */
        .quiz-result-box {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            border-radius: var(--radius-lg);
            padding: 40px 30px;
            text-align: center;
        }
        .quiz-result-box h2 {
            margin: 0 0 10px;
            color: var(--success);
            font-weight: 700;
        }
        .quiz-result-box .score {
            font-size: 56px;
            font-weight: 700;
            color: var(--text-strong);
            margin: 16px 0 8px;
            letter-spacing: -1px;
        }
        .quiz-result-box .note { color: var(--text-muted); font-size: 14px; margin: 0 0 6px; }
        .quiz-result-box .time { color: var(--text-muted); font-size: 14px; margin: 0 0 28px; }
        .quiz-result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        .group-stats { margin: 24px 0; }
        .group-stats-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-strong);
            margin-bottom: 14px;
        }
        .group-row {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            overflow: hidden;
            background: var(--card-bg);
            transition: all .2s;
        }
        .group-row:hover { box-shadow: var(--shadow-sm); }
        .group-row.expanded { border-color: var(--primary); }
        .group-row-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            cursor: pointer;
            gap: 12px;
            user-select: none;
        }
        .group-row-name {
            font-weight: 500;
            color: var(--text-strong);
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .group-row-arrow {
            color: var(--text-muted);
            font-size: 12px;
            transition: transform .2s;
        }
        .group-row.expanded .group-row-arrow { transform: rotate(90deg); }
        .group-row-right { display: flex; align-items: center; gap: 14px; }
        .group-row-count {
            font-size: 14px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .group-row-bar {
            width: 100px;
            height: 8px;
            background: var(--hover);
            border-radius: 100px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .group-row-bar-fill { height: 100%; transition: width .4s; border-radius: 100px; }
        .group-row-percent {
            font-size: 14px;
            font-weight: 700;
            min-width: 48px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .group-row-details {
            display: none;
            padding: 0 20px 20px;
            border-top: 1px solid var(--border);
        }
        .group-row.expanded .group-row-details { display: block; animation: fadeIn .3s ease; }
        .group-q-item { padding: 16px 0; border-bottom: 1px solid var(--border); }
        .group-q-item:last-child { border-bottom: none; }
        .group-q-text {
            font-weight: 500;
            color: var(--text-strong);
            margin-bottom: 12px;
            font-size: 15px;
            line-height: 1.5;
        }
        .group-q-status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 8px;
            text-transform: uppercase;
            letter-spacing: .4px;
            vertical-align: middle;
        }
        .group-q-status.ok { background: var(--success-bg); color: var(--success); }
        .group-q-status.fail { background: var(--error-bg); color: var(--error); }
        .group-q-answers { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
        .group-q-answer {
            font-size: 14px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            color: var(--text);
            background: var(--placeholder-bg);
            line-height: 1.4;
        }
        .group-q-answer.user-correct {
            background: var(--success-bg);
            color: var(--success);
            font-weight: 500;
        }
        .group-q-answer.user-wrong {
            background: var(--error-bg);
            color: var(--error);
        }
        .group-q-answer.correct-answer { border: 1px dashed var(--success); }

        .group-match-pairs { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
        .group-match-pair {
            font-size: 14px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            background: var(--placeholder-bg);
            color: var(--text);
            line-height: 1.4;
        }
        .group-match-pair.correct-answer {
            background: var(--success-bg);
            color: var(--success);
            border: 1px dashed var(--success);
        }

        .group-card-view {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .group-card-side {
            flex: 1;
            min-width: 180px;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            background: var(--placeholder-bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.4;
        }
        .group-card-side-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 6px;
        }
        .group-card-side img {
            max-width: 100%;
            max-height: 140px;
            border-radius: 4px;
            margin-top: 8px;
            display: block;
        }

        /* ===== MEMO ===== */
        .memo-screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .memo-screen-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-strong);
            margin: 0;
            line-height: 1.3;
            letter-spacing: -.2px;
        }

        .memo-grid {
            display: grid;
            gap: 20px;
            align-items: start;
        }
        .memo-grid.cols-1 { grid-template-columns: 1fr; }
        .memo-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .memo-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
        .memo-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

        .memo-cell {
            background: var(--card-face-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: box-shadow .2s;
            display: flex;
            flex-direction: column;
        }
        .memo-cell:hover { box-shadow: var(--shadow-md); }

        .memo-cell-header {
            background: var(--secondary);
            color: #fff;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .6px;
            line-height: 1.3;
        }
        .memo-cell-header.with-icon {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .memo-cell-header .memo-cell-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .memo-cell-body {
            padding: 20px 22px;
            color: var(--card-face-text);
            flex: 1;
        }
        .memo-cell-body p {
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 12px;
            color: var(--card-face-text);
        }
        .memo-cell-body p:last-child { margin-bottom: 0; }
        .memo-cell-body h3 {
            font-size: 16px;
            font-weight: 700;
            margin: 16px 0 10px;
            color: var(--card-face-text);
        }
        .memo-cell-body h3:first-child { margin-top: 0; }
        .memo-cell-body ul {
            margin: 0 0 12px;
            padding-left: 20px;
        }
        .memo-cell-body ul:last-child { margin-bottom: 0; }
        .memo-cell-body ul li {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 6px;
            color: var(--card-face-text);
        }
        .memo-cell-body .quote {
            margin: 16px 0;
            padding: 12px 16px;
            background: var(--secondary-soft);
            border-left: 4px solid var(--secondary);
            border-radius: var(--radius-sm);
            font-size: 14px;
            line-height: 1.6;
            color: var(--card-face-text);
        }
        .memo-cell-body .quote:last-child { margin-bottom: 0; }
        .memo-cell-body strong { color: var(--card-face-text); font-weight: 700; }

        .memo-cell-body .slide-media { margin: 16px 0; }
        .memo-cell-body .slide-media:last-child { margin-bottom: 0; }
        .memo-cell-body .slide-media img,
        .memo-cell-body .slide-media video {
            background: var(--media-bg);
        }

        .memo-cell-body .slide-link {
            background: var(--secondary-soft);
            color: var(--secondary);
        }

        .memo-grid.cols-1 .memo-cell-body {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .memo-grid.cols-1 .memo-cell-header {
            padding: 18px 32px;
            font-size: 16px;
        }

        @media (max-width: 900px) {
            .memo-grid.cols-3,
            .memo-grid.cols-4 {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .memo-grid.cols-1,
            .memo-grid.cols-2,
            .memo-grid.cols-3,
            .memo-grid.cols-4 {
                grid-template-columns: 1fr;
            }
            .memo-grid { gap: 14px; }
            .memo-cell-body { padding: 16px 18px; }
            .memo-screen-title { font-size: 20px; }
        }

        @media (max-width: 800px) {
            .lesson-layout, .quiz-layout { flex-direction: column; }
            .lesson-sidebar, .quiz-sidebar { width: 100%; position: static; order: -1; }
            .lesson-main, .quiz-main { width: 100%; }
            .topic-list { flex-direction: row; flex-wrap: wrap; }
            .quiz-nav-grid { grid-template-columns: repeat(6, 1fr); }
            .group-row-bar { width: 60px; }
            .screen-title { font-size: 24px; }
        }

        /* ===== ПЕЧАТЬ ===== */
        .print-video-placeholder {
            display: none;
            padding: 16px 20px;
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
            background: var(--placeholder-bg);
            color: var(--text-muted);
            font-size: 14px;
            font-style: italic;
            text-align: center;
            margin: 24px 0;
        }
        .print-answers-block {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 2px solid var(--border);
        }
        .print-answers-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 16px;
            color: var(--text-strong);
        }
        .print-answer-item {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 6px;
            color: var(--text);
        }
        .print-answer-item strong { color: var(--text-strong); font-weight: 700; }
        .print-question-item {
            margin-bottom: 32px;
            page-break-inside: avoid;
        }
        .print-question-number {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-strong);
            margin-bottom: 8px;
        }
        .print-question-text {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 12px;
            color: var(--text);
        }
        .print-options { margin: 0 0 12px; padding-left: 4px; }
        .print-option {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 6px;
            color: var(--text);
        }
        .print-match-pairs { margin: 0 0 12px; }
        .print-match-pair {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 4px;
            color: var(--text);
        }
        .print-card-front {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 8px;
            padding: 12px 16px;
            background: var(--card-face-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            color: var(--card-face-text);
            display: inline-block;
            min-width: 200px;
        }

        @media print {
            .btn-icon,
            .btn-text,
            .btn-primary,
            .btn-outline,
            .btn-danger,
            .progress-bar,
            .timer,
            .lesson-sidebar,
            .quiz-sidebar,
            .quiz-nav-grid,
            .nav-row,
            .quiz-nav-row,
            .memo-screen-header .header-right,
            .screen-subtitle,
            .screen-header .btn-icon,
            .menu-list,
            .print-hide {
                display: none !important;
            }

            body {
                background: #fff !important;
                padding: 0 !important;
                color: #000 !important;
                font-size: 12pt;
            }
            .app-container {
                max-width: none !important;
                padding: 0 !important;
            }

            .screen { display: none !important; }
            .screen.active { display: block !important; }

            .card, .memo-cell, .card-face {
                box-shadow: none !important;
                border: none !important;
                background: #fff !important;
                border-radius: 0 !important;
            }
            .card-body {
                padding: 0 !important;
            }
            .menu-item {
                box-shadow: none !important;
                border: none !important;
            }

            .lesson-header,
            .memo-screen-header {
                margin-bottom: 16px;
                border-bottom: 1px solid #ccc;
                padding-bottom: 8px;
            }
            .lesson-title,
            .memo-screen-title {
                font-size: 16pt;
                color: #000 !important;
            }

            .slide-title {
                font-size: 18pt;
                color: #000 !important;
                margin: 0 0 16px;
            }
            .slide-content p,
            .slide-content li,
            .slide-content h3 {
                color: #000 !important;
            }
            .slide-content h3 {
                font-size: 14pt;
                page-break-after: avoid;
            }
            .slide-content p,
            .slide-content li {
                font-size: 12pt;
                page-break-inside: avoid;
            }
            .slide-content .quote {
                background: #f5f5f5 !important;
                border-left: 3px solid #888 !important;
                page-break-inside: avoid;
            }

            .slide-media img,
            .slide-media video,
            .memo-cell-body img,
            .memo-cell-body video {
                max-width: 100% !important;
                max-height: 60vh !important;
                page-break-inside: avoid;
            }

            .slide-media video {
                display: none !important;
            }
            .slide-media.has-video .print-video-placeholder {
                display: block !important;
            }

            .slide-link {
                background: transparent !important;
                border: 1px solid #888 !important;
                color: #000 !important;
                padding: 6px 12px;
                font-size: 11pt;
            }
            .slide-link.internal {
                background: transparent !important;
                color: #000 !important;
            }

            .memo-grid {
                gap: 12px !important;
            }
            .memo-cell {
                page-break-inside: avoid;
                margin-bottom: 12px;
                border: 1px solid #ddd !important;
                background: #fff !important;
            }
            .memo-cell-header {
                background: var(--secondary) !important;
                color: #fff !important;
                padding: 8px 12px;
                font-size: 11pt;
                border-bottom: 1px solid #ccc;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .memo-cell-body {
                padding: 10px 14px !important;
                color: #000 !important;
            }
            .memo-cell-body p,
            .memo-cell-body li,
            .memo-cell-body h3,
            .memo-cell-body .quote {
                color: #000 !important;
            }
            .memo-cell-body .quote {
                background: #f5f5f5 !important;
                border-left: 3px solid #888 !important;
            }

            .quiz-question-text,
            .quiz-hint {
                color: #000 !important;
            }
            .print-question-item {
                page-break-inside: avoid;
            }
            .print-question-number { color: #000 !important; }
            .print-question-text { color: #000 !important; }
            .print-option { color: #000 !important; }
            .print-card-front { color: #000 !important; background: #f5f5f5 !important; }

            .print-answers-block {
                page-break-before: always;
            }
            .print-answers-title { color: #000 !important; font-size: 14pt; }
            .print-answer-item { color: #000 !important; font-size: 11pt; }
            .print-answer-item strong { color: #000 !important; }

            .print-match-pair { color: #000 !important; font-size: 11pt; }

            @media (max-width: 900px) {
                .memo-grid.cols-3,
                .memo-grid.cols-4 {
                    grid-template-columns: repeat(2, 1fr) !important;
                }
            }

            .group-q-item,
            .slide-media {
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

<div class="app-container" id="app-container">

    <div class="screen active" id="screen-menu">
        <div class="screen-header">
            <div>
                <h1 class="screen-title" id="course-title" ondblclick="openAdmin()">Курс</h1>
                <p class="screen-subtitle">Выбери блок и изучай теорию, проходи тесты или открывай памятки</p>
            </div>
            <button class="btn-icon" onclick="toggleTheme()" title="Сменить тему">🌙</button>
        </div>
        <div class="menu-list" id="menu-list"></div>
    </div>

    <div class="screen" id="screen-lesson">
        <div class="card">
            <div class="card-body">
                <div class="lesson-header">
                    <div class="lesson-title" id="lesson-title"></div>
                    <div class="header-right">
                        <button class="btn-icon print-hide" onclick="printCurrent()" title="Сохранить в PDF">📄</button>
                        <button class="btn-icon print-hide" onclick="toggleTheme()" title="Сменить тему">🌙</button>
                        <button class="btn btn-text print-hide" onclick="exitToMenu()">← В меню</button>
                    </div>
                </div>
                <div class="progress-bar" style="margin-top:20px;"><div class="progress-fill" id="progress-fill"></div></div>
            </div>
        </div>

        <div class="lesson-layout">
            <div class="lesson-main">
                <div class="card">
                    <div class="card-body" id="slide-content"></div>
                </div>
            </div>
            <aside class="lesson-sidebar">
                <h3>Содержание</h3>
                <nav class="topic-list" id="topic-list"></nav>
            </aside>
        </div>
    </div>

    <div class="screen" id="screen-quiz">
        <div class="card">
            <div class="card-body">
                <div class="lesson-header">
                    <div class="lesson-title" id="quiz-title"></div>
                    <div class="header-right">
                        <span class="timer print-hide" id="quiz-timer">00:00</span>
                        <button class="btn-icon print-hide" onclick="printCurrent()" title="Сохранить в PDF">📄</button>
                        <button class="btn-icon print-hide" onclick="toggleTheme()" title="Сменить тему">🌙</button>
                        <button class="btn btn-text print-hide" onclick="exitToMenu()">← В меню</button>
                    </div>
                </div>
                <div class="progress-bar" style="margin-top:20px;"><div class="progress-fill" id="quiz-progress-fill"></div></div>
            </div>
        </div>

        <div class="quiz-layout">
            <div class="quiz-main">
                <div class="card">
                    <div class="card-body" id="quiz-content"></div>
                </div>
            </div>
            <aside class="quiz-sidebar">
                <h3>Навигация</h3>
                <div class="quiz-nav-grid" id="quiz-nav-grid"></div>
            </aside>
        </div>
    </div>

    <div class="screen" id="screen-memo">
        <div class="memo-screen-header">
            <h1 class="memo-screen-title" id="memo-title"></h1>
            <div class="header-right">
                <button class="btn-icon print-hide" onclick="printCurrent()" title="Сохранить в PDF">📄</button>
                <button class="btn-icon print-hide" onclick="toggleTheme()" title="Сменить тему">🌙</button>
                <button class="btn btn-text print-hide" onclick="exitToMenu()">← В меню</button>
            </div>
        </div>
        <div class="memo-grid" id="memo-grid"></div>
    </div>

</div>

<script src="data.js"></script>

<script>
    const STORAGE_KEY = "kp_course_v1";
    const THEME_KEY = "kp_course_theme";

    let currentLessonId = null;
    let currentSlide = 0;
    let slides = [];
    let lessonState = {};
    let quizTimerInterval = null;

    const appContainer = document.getElementById("app-container");
    const menuList = document.getElementById("menu-list");
    const lessonTitleEl = document.getElementById("lesson-title");
    const quizTitleEl = document.getElementById("quiz-title");
    const progressFill = document.getElementById("progress-fill");
    const quizProgressFill = document.getElementById("quiz-progress-fill");
    const slideContent = document.getElementById("slide-content");
    const topicList = document.getElementById("topic-list");
    const quizContent = document.getElementById("quiz-content");
    const quizNavGrid = document.getElementById("quiz-nav-grid");
    const quizTimerEl = document.getElementById("quiz-timer");
    const memoTitleEl = document.getElementById("memo-title");
    const memoGridEl = document.getElementById("memo-grid");

    function openAdmin() {
        window.open("admin.html", "_blank");
    }
    (function setupDoubleTap() {
        const titleEl = document.getElementById("course-title");
        if (!titleEl) return;
        let lastTap = 0;
        titleEl.addEventListener("touchend", (e) => {
            const now = Date.now();
            if (now - lastTap < 400) {
                e.preventDefault();
                openAdmin();
                lastTap = 0;
            } else {
                lastTap = now;
            }
        }, { passive: false });
    })();

    function normalizeCorrect(correct) {
        if (Array.isArray(correct)) return correct;
        return [correct];
    }
    function detectType(q) {
        if (q.type) return q.type;
        if (q.pairs && Array.isArray(q.pairs)) return "match";
        if ((q.front !== undefined) || (q.back !== undefined)) return "card";
        const c = normalizeCorrect(q.correct);
        return c.length > 1 ? "multi" : "single";
    }
    Object.values(allLessons).forEach(lesson => {
        if (lesson.type === "quiz") {
            if (!lesson.groups) lesson.groups = [];
            if (lesson.randomizeQuestions === undefined) lesson.randomizeQuestions = false;
            if (lesson.randomizeOptions === undefined) lesson.randomizeOptions = false;
            if (lesson.questions) {
                lesson.questions.forEach(q => {
                    q.type = detectType(q);
                    if (q.type === "single" || q.type === "multi") {
                        q.correct = normalizeCorrect(q.correct);
                    }
                    if (q.group === undefined) q.group = null;
                });
            }
        } else if (lesson.type === "memo") {
            if (!lesson.cells) lesson.cells = [];
            lesson.cells.forEach(cell => {
                if (!cell.content) cell.content = [];
                if (cell.title === undefined) cell.title = "";
            });
        }
    });

    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        document.querySelectorAll('.btn-icon[onclick*="toggleTheme"]').forEach(btn => {
            btn.textContent = theme === "dark" ? "☀️" : "🌙";
            btn.title = theme === "dark" ? "Светлая тема" : "Тёмная тема";
        });
    }
    function toggleTheme() {
        const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
        const next = current === "dark" ? "light" : "dark";
        localStorage.setItem(THEME_KEY, next);
        applyTheme(next);
    }
    (function initTheme() {
        const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
        applyTheme(current);
    })();

    if (typeof courseSettings !== "undefined") {
        if (courseSettings.pageTitle) document.title = courseSettings.pageTitle;
        if (courseSettings.courseTitle) document.getElementById("course-title").textContent = courseSettings.courseTitle;
    }

    function showScreen(name) {
        document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
        document.getElementById("screen-" + name).classList.add("active");
        if (name === "memo") appContainer.classList.add("wide");
        else appContainer.classList.remove("wide");
    }
    function loadAll() { try { const raw = localStorage.getItem(STORAGE_KEY); lessonState = raw ? JSON.parse(raw) : {}; } catch(e) { lessonState = {}; } }
    function saveAll() { localStorage.setItem(STORAGE_KEY, JSON.stringify(lessonState)); }
    function getState(id) {
        if (!lessonState[id]) lessonState[id] = { currentSlide:0, visited:[], completed:false };
        if (!lessonState[id].visited) lessonState[id].visited = [];
        return lessonState[id];
    }
    function getQuizState(id) {
        if (!lessonState[id]) lessonState[id] = { currentQuestion:0, questionState:[], score:0, timerSeconds:0, completed:false };
        if (!lessonState[id].questionState) lessonState[id].questionState = [];
        if (!lessonState[id]._questionsOrder) lessonState[id]._questionsOrder = null;
        if (!lessonState[id]._optionsOrder) lessonState[id]._optionsOrder = null;
        if (!lessonState[id]._matchOrder) lessonState[id]._matchOrder = null;
        return lessonState[id];
    }

    function renderMenu() {
        loadAll();
        let html = "";
        for (const id in allLessons) {
            const lesson = allLessons[id];
            const isQuiz = lesson.type === "quiz";
            const isMemo = lesson.type === "memo";
            const state = lessonState[id] || {};
            const started = isQuiz
                ? (state.questionState || []).some(q => q && q.done)
                : (isMemo ? false : (state.visited || []).length > 0);

            let cls = "menu-item " + (isQuiz ? "quiz" : (isMemo ? "memo" : "theory"));
            const badge = isQuiz
                ? `<span class="menu-type-badge quiz">Тест</span>`
                : (isMemo ? `<span class="menu-type-badge memo">Памятка</span>` : `<span class="menu-type-badge theory">Теория</span>`);
            const icon = isQuiz ? "🧪 " : (isMemo ? "📌 " : "📖 ");

            html += `<div class="${cls}"><div class="menu-info">`;
            html += `<h3>${icon}${lesson.title} ${badge}</h3>`;
            if (isQuiz) html += `<p>${lesson.questions.length} вопросов</p>`;
            else if (isMemo) {
                const cellCount = (lesson.cells || []).length;
                html += `<p>${cellCount} ${pluralizeCells(cellCount)}</p>`;
            }
            else html += `<p>${lesson.slides.length} слайдов</p>`;
            html += `</div><div class="menu-actions">`;

            if (isMemo) {
                html += `<button class="btn btn-primary" onclick="openMemo('${id}')">Открыть</button>`;
            } else if (isQuiz) {
                if (started) {
                    html += `<button class="btn btn-primary" onclick="startQuiz('${id}')">Продолжить</button>`;
                    html += `<button class="btn btn-text" onclick="resetBlock('${id}')">Сначала</button>`;
                } else {
                    html += `<button class="btn btn-primary" onclick="startQuiz('${id}')">Начать</button>`;
                }
            } else {
                if (started) {
                    html += `<button class="btn btn-primary" onclick="continueLesson('${id}')">Продолжить</button>`;
                    html += `<button class="btn btn-text" onclick="resetBlock('${id}')">Сначала</button>`;
                } else {
                    html += `<button class="btn btn-primary" onclick="startLesson('${id}')">Начать</button>`;
                }
            }
            html += `</div></div>`;
        }
        menuList.innerHTML = html;
    }

    function pluralizeCells(n) {
        const mod10 = n % 10;
        const mod100 = n % 100;
        if (mod10 === 1 && mod100 !== 11) return "ячейка";
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return "ячейки";
        return "ячеек";
    }

    function resetBlock(id) { delete lessonState[id]; saveAll(); renderMenu(); }

    function startLesson(id) {
        const lesson = allLessons[id];
        currentLessonId = id; slides = lesson.slides; currentSlide = 0;
        lessonTitleEl.textContent = lesson.title;
        showScreen("lesson"); markVisited(0); renderSlide();
    }
    function continueLesson(id) {
        const lesson = allLessons[id]; const state = getState(id);
        currentLessonId = id; slides = lesson.slides; currentSlide = state.currentSlide || 0;
        lessonTitleEl.textContent = lesson.title;
        showScreen("lesson"); markVisited(currentSlide); renderSlide();
    }
    function exitToMenu() {
        stopQuizTimer();
        if (currentLessonId) {
            const lesson = allLessons[currentLessonId];
            if (lesson && lesson.type === "quiz") saveAll();
            else if (lesson && lesson.type === "theory") { const s = getState(currentLessonId); s.currentSlide = currentSlide; saveAll(); }
        }
        showScreen("menu"); renderMenu();
    }
    function markVisited(i) { const s = getState(currentLessonId); if (!s.visited.includes(i)) s.visited.push(i); s.currentSlide = i; saveAll(); }
    function updateProgressBar() { const s = getState(currentLessonId); progressFill.style.width = (s.visited.length / slides.length) * 100 + "%"; }
    function renderTopicList() {
        const s = getState(currentLessonId);
        let html = "";
        slides.forEach((slide, i) => {
            let cls = "topic-item";
            if (i === currentSlide) cls += " current";
            else if (s.visited.includes(i)) cls += " visited";
            html += `<button class="${cls}" onclick="goToSlide(${i})">${slide.shortName}</button>`;
        });
        topicList.innerHTML = html;
    }
    function goToSlide(i) { currentSlide = i; markVisited(i); renderSlide(); }

    function renderContentBlocks(blocks) {
        let html = "";
        (blocks || []).forEach(b => {
            if (b.type === "p") html += `<p>${b.text}</p>`;
            else if (b.type === "h3") html += `<h3>${b.text}</h3>`;
            else if (b.type === "ul") { html += `<ul>`; b.items.forEach(i => html += `<li>${i}</li>`); html += `</ul>`; }
            else if (b.type === "quote") html += `<div class="quote">${b.text}</div>`;
            else if (b.type === "link") html += renderLinkBlock(b);
            else if (b.type === "image" && b.src) html += `<div class="slide-media"><img src="${b.src}" alt="${b.alt || ''}" loading="lazy"></div>`;
            else if (b.type === "video" && b.src) {
                html += `<div class="slide-media has-video">`;
                html += `<video src="${b.src}" controls preload="metadata"></video>`;
                html += `<div class="print-video-placeholder">🎬 [Видео: ${escapeHtml(b.src)}]</div>`;
                html += `</div>`;
            }
        });
        return html;
    }

    function renderSlide() {
        const slide = slides[currentSlide];
        const isLast = currentSlide === slides.length - 1;
        let html = `<h2 class="slide-title">${slide.title}</h2>`;
        html += `<div class="slide-content">`;
        html += renderContentBlocks(slide.content);
        html += `</div>`;
        html += `<div class="nav-row">`;
        if (currentSlide > 0) html += `<button class="nav-btn" onclick="goPrev()">← Назад</button>`;
        else html += `<div></div>`;
        if (isLast) html += `<button class="nav-btn primary" onclick="finishLesson()">Завершить блок</button>`;
        else html += `<button class="nav-btn primary" onclick="goNext()">Дальше →</button>`;
        html += `</div>`;
        slideContent.innerHTML = html;

        slideContent.querySelectorAll('.slide-media img, .slide-media video').forEach(el => {
            el.addEventListener('error', () => {
                const wrap = el.closest('.slide-media');
                if (!wrap) return;
                const src = el.getAttribute('src') || '';
                const isVideo = el.tagName === 'VIDEO';
                wrap.innerHTML = `<div class="slide-media-error">
                    ⚠ ${isVideo ? 'Видео' : 'Картинка'} не найдено:<br>
                    <code>${escapeHtml(src)}</code>
                </div>`;
            });
        });

        renderTopicList(); updateProgressBar();
    }
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));
    }
    function renderLinkBlock(b) {
        const href = b.href || ""; const text = b.text || "Ссылка";
        const isInternal = href.startsWith("#");
        if (isInternal) return `<div class="link-block"><a class="slide-link internal" href="javascript:void(0)" onclick="goToInternalLink('${href}')">🔗 ${text}</a></div>`;
        return `<div class="link-block"><a class="slide-link" href="${href}" target="_blank" rel="noopener">🔗 ${text}</a></div>`;
    }
    function goToInternalLink(href) {
        const raw = href.slice(1); const parts = raw.split(":");
        const lessonId = parts[0]; const slideNum = parts[1] ? parseInt(parts[1]) - 1 : 0;
        const lesson = allLessons[lessonId];
        if (!lesson) { alert("Блок не найден: " + lessonId); return; }
        if (currentLessonId) {
            const cur = allLessons[currentLessonId];
            if (cur && cur.type === "theory") { const s = getState(currentLessonId); s.currentSlide = currentSlide; saveAll(); }
        }
        if (lesson.type === "quiz") { startQuiz(lessonId); return; }
        if (lesson.type === "memo") { openMemo(lessonId); return; }
        currentLessonId = lessonId; slides = lesson.slides;
        lessonTitleEl.textContent = lesson.title; showScreen("lesson");
        currentSlide = (slideNum >= 0 && slideNum < slides.length) ? slideNum : 0;
        markVisited(currentSlide); renderSlide();
        window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function goNext() { if (currentSlide < slides.length - 1) { currentSlide++; markVisited(currentSlide); renderSlide(); window.scrollTo({top:0,behavior:"smooth"}); } }
    function goPrev() { if (currentSlide > 0) { currentSlide--; markVisited(currentSlide); renderSlide(); window.scrollTo({top:0,behavior:"smooth"}); } }
    function finishLesson() {
        const s = getState(currentLessonId);
        s.completed = true; s.currentSlide = currentSlide; saveAll();
        showScreen("menu"); renderMenu();
    }

    /* ===== ПАМЯТКА ===== */
    function openMemo(id) {
        stopQuizTimer();
        const lesson = allLessons[id];
        if (!lesson || lesson.type !== "memo") return;
        currentLessonId = id;
        memoTitleEl.textContent = lesson.title;
        renderMemo(lesson);
        showScreen("memo");
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function getMemoCols(count) {
        if (count <= 1) return 1;
        if (count === 2) return 2;
        if (count === 3) return 3;
        if (count === 4) return 2;
        if (count === 5) return 3;
        if (count === 6) return 3;
        if (count === 7) return 4;
        return 4;
    }

    function renderMemo(lesson) {
        const cells = lesson.cells || [];
        const count = cells.length;
        const cols = getMemoCols(count);
        memoGridEl.className = "memo-grid cols-" + cols;

        let html = "";
        cells.forEach(cell => {
            html += `<div class="memo-cell">`;
            if (cell.title) {
                html += `<div class="memo-cell-header">${cell.title}</div>`;
            }
            html += `<div class="memo-cell-body">`;
            html += renderContentBlocks(cell.content);
            html += `</div>`;
            html += `</div>`;
        });
        memoGridEl.innerHTML = html;

        memoGridEl.querySelectorAll('.slide-media img, .slide-media video').forEach(el => {
            el.addEventListener('error', () => {
                const wrap = el.closest('.slide-media');
                if (!wrap) return;
                const src = el.getAttribute('src') || '';
                const isVideo = el.tagName === 'VIDEO';
                wrap.innerHTML = `<div class="slide-media-error">
                    ⚠ ${isVideo ? 'Видео' : 'Картинка'} не найдено:<br>
                    <code>${escapeHtml(src)}</code>
                </div>`;
            });
        });
    }

    /* ===== ТЕСТ ===== */
    function startQuiz(id) {
        const lesson = allLessons[id];
        currentLessonId = id;
        const qs = getQuizState(id);

        if (qs.questionState.length !== lesson.questions.length) {
            qs.questionState = lesson.questions.map(q => makeFreshQuestionState(q));
            qs.currentQuestion = 0; qs.score = 0; qs.timerSeconds = 0; qs.completed = false;
            qs._questionsOrder = null;
            qs._optionsOrder = null;
            qs._matchOrder = null;
        }
        qs.questionState.forEach(s => {
            if (!s.selected) s.selected = [];
            if (s.lastCheckWrong === undefined) s.lastCheckWrong = false;
            if (s.matchedPairs === undefined) s.matchedPairs = [];
            if (s.hadError === undefined) s.hadError = false;
            if (s.userAnswer === undefined) s.userAnswer = null;
        });

        if (!qs._questionsOrder || qs._questionsOrder.length !== lesson.questions.length) {
            let order = lesson.questions.map((_, i) => i);
            if (lesson.randomizeQuestions) order = shuffle(order);
            qs._questionsOrder = order;
        }

        if (!qs._optionsOrder || qs._optionsOrder.length !== lesson.questions.length) {
            qs._optionsOrder = lesson.questions.map(q => {
                if (q.type !== "single" && q.type !== "multi") return null;
                let idxs = (q.options || []).map((_, i) => i);
                if (lesson.randomizeOptions) idxs = shuffle(idxs);
                return idxs;
            });
        }

        if (!qs._matchOrder || qs._matchOrder.length !== lesson.questions.length) {
            qs._matchOrder = lesson.questions.map(q => {
                if (q.type !== "match") return null;
                const n = (q.pairs || []).length;
                const leftOrder = shuffle([...Array(n).keys()]);
                const rightOrder = shuffle([...Array(n).keys()]);
                return { leftOrder, rightOrder };
            });
        }

        quizTitleEl.textContent = lesson.title;
        showScreen("quiz"); startQuizTimer(); renderQuiz();
    }
    function makeFreshQuestionState(q) {
        const base = { done: false, wrong: false, selected: [], lastCheckWrong: false };
        if (q.type === "match") {
            base.matchedPairs = [];
            base.hadError = false;
            base._pendingLeft = null;
            base._pendingRight = null;
        }
        if (q.type === "card") {
            base.userAnswer = null;
        }
        return base;
    }
    function continueQuiz(id) { startQuiz(id); }
    function startQuizTimer() {
        stopQuizTimer();
        updateQuizTimerDisplay();
        quizTimerInterval = setInterval(() => {
            const qs = getQuizState(currentLessonId);
            qs.timerSeconds = (qs.timerSeconds || 0) + 1;
            updateQuizTimerDisplay();
            if (qs.timerSeconds % 10 === 0) saveAll();
        }, 1000);
    }
    function stopQuizTimer() { if (quizTimerInterval) { clearInterval(quizTimerInterval); quizTimerInterval = null; } }
    function updateQuizTimerDisplay() { quizTimerEl.textContent = formatTime(getQuizState(currentLessonId).timerSeconds || 0); }
    function formatTime(s) { const m = Math.floor(s / 60); const ss = s % 60; return String(m).padStart(2,"0") + ":" + String(ss).padStart(2,"0"); }

    function renderQuiz() {
        const lesson = allLessons[currentLessonId];
        const qs = getQuizState(currentLessonId);
        const done = qs.questionState.filter(q => q && q.done).length;
        quizProgressFill.style.width = (done / lesson.questions.length) * 100 + "%";

        if (qs.currentQuestion >= lesson.questions.length) {
            renderQuizResult(lesson, qs); renderQuizNavGrid(); return;
        }

        const origIdx = qs._questionsOrder[qs.currentQuestion];
        const q = lesson.questions[origIdx];
        const state = qs.questionState[origIdx];
        if (!state.selected) state.selected = [];

        let html = "";
        if (q.type === "single" || q.type === "multi") {
            html = renderChoiceQuestion(lesson, q, state, origIdx, qs);
        } else if (q.type === "match") {
            html = renderMatchQuestion(lesson, q, state, origIdx, qs);
        } else if (q.type === "card") {
            html = renderCardQuestion(lesson, q, state, origIdx, qs);
        }
        quizContent.innerHTML = html;
        renderQuizNavGrid();
    }

    function renderChoiceQuestion(lesson, q, state, origIdx, qs) {
        const correctArr = normalizeCorrect(q.correct);
        const isMulti = q.type === "multi";
        const optOrder = qs._optionsOrder[origIdx] || (q.options || []).map((_, i) => i);

        let html = "";
        html += `<div class="quiz-question-text">${q.text}</div>`;
        if (isMulti) html += `<div class="quiz-hint">Выберите один или несколько правильных ответов</div>`;

        html += `<div class="quiz-options">`;
        optOrder.forEach((origOptIdx) => {
            const opt = q.options[origOptIdx];
            const isCorrectOpt = correctArr.includes(opt);
            const wasSelected = state.selected.includes(origOptIdx);
            let cls = "quiz-opt";
            if (state.done) {
                if (isCorrectOpt) cls += " correct";
                else if (wasSelected) cls += " wrong";
            } else if (state.lastCheckWrong) {
                if (wasSelected && !isCorrectOpt) cls += " wrong";
                else if (wasSelected) cls += " selected";
            } else {
                if (wasSelected) cls += " selected";
            }
            const disabled = state.done ? " disabled" : "";
            const onclick = isMulti ? `onclick="quizToggleOption(${origOptIdx})"` : `onclick="quizAnswer(${origOptIdx})"`;
            html += `<button class="${cls}"${disabled} ${onclick}>${opt}</button>`;
        });
        html += `</div>`;

        if (q.explain) {
            html += `<div class="quiz-explain${state.done ? ' show' : ''}"><strong>💡 Почему так:</strong> ${q.explain}</div>`;
        }

        html += `<div class="quiz-nav-row">`;
        if (qs.currentQuestion > 0) html += `<button class="quiz-nav-btn" onclick="quizGoPrev()">← Назад</button>`;
        else html += `<div></div>`;

        if (isMulti) {
            if (state.done) {
                const isLast = qs.currentQuestion === lesson.questions.length - 1;
                const label = isLast ? "К результату →" : "Дальше →";
                html += `<button class="quiz-nav-btn primary" onclick="quizGoNext()">${label}</button>`;
            } else {
                const canCheck = state.selected.length > 0;
                html += `<button class="quiz-nav-btn check" onclick="quizCheckMulti()" ${canCheck ? '' : 'disabled'}>Проверить</button>`;
            }
        } else {
            const isLast = qs.currentQuestion === lesson.questions.length - 1;
            const label = isLast ? "К результату →" : "Дальше →";
            html += `<button class="quiz-nav-btn primary" id="quiz-next-btn" onclick="quizGoNext()" ${state.done ? '' : 'disabled'}>${label}</button>`;
        }
        html += `</div>`;
        return html;
    }

    function renderMatchQuestion(lesson, q, state, origIdx, qs) {
        const order = qs._matchOrder[origIdx];
        const total = (q.pairs || []).length;
        const matchedCount = state.matchedPairs.length;
        const allMatched = matchedCount === total;

        const pendingLeft = state._pendingLeft;
        const pendingRight = state._pendingRight;

        let html = "";
        html += `<div class="quiz-question-text">${q.text || "Соедини пары"}</div>`;
        html += `<div class="match-counter">Соединено: ${matchedCount} / ${total}</div>`;

        html += `<div class="match-grid">`;

        html += `<div class="match-col">`;
        order.leftOrder.forEach(pairIdx => {
            const isMatched = state.matchedPairs.includes(pairIdx);
            const isSelected = pendingLeft === pairIdx;
            let cls = "match-item";
            if (isMatched) cls += " matched";
            else if (isSelected) cls += " selected";
            const onclick = isMatched ? "" : `onclick="matchClickLeft(${pairIdx})"`;
            html += `<button class="${cls}" ${onclick}>${q.pairs[pairIdx].left}</button>`;
        });
        html += `</div>`;

        html += `<div class="match-col">`;
        order.rightOrder.forEach(pairIdx => {
            const isMatched = state.matchedPairs.includes(pairIdx);
            const isSelected = pendingRight === pairIdx;
            let cls = "match-item";
            if (isMatched) cls += " matched";
            else if (isSelected) cls += " selected";
            const onclick = isMatched ? "" : `onclick="matchClickRight(${pairIdx})"`;
            html += `<button class="${cls}" ${onclick}>${q.pairs[pairIdx].right}</button>`;
        });
        html += `</div>`;

        html += `</div>`;

        if (allMatched && q.explain) {
            html += `<div class="quiz-explain show"><strong>💡 Почему так:</strong> ${q.explain}</div>`;
        }

        html += `<div class="quiz-nav-row">`;
        if (qs.currentQuestion > 0) html += `<button class="quiz-nav-btn" onclick="quizGoPrev()">← Назад</button>`;
        else html += `<div></div>`;
        const isLast = qs.currentQuestion === lesson.questions.length - 1;
        const label = isLast ? "К результату →" : "Дальше →";
        html += `<button class="quiz-nav-btn primary" onclick="quizGoNext()" ${allMatched ? '' : 'disabled'}>${label}</button>`;
        html += `</div>`;

        return html;
    }

    function matchClickLeft(pairIdx) {
        const qs = getQuizState(currentLessonId);
        const origIdx = qs._questionsOrder[qs.currentQuestion];
        const state = qs.questionState[origIdx];
        if (state.matchedPairs.includes(pairIdx)) return;

        if (state._pendingLeft === pairIdx) {
            state._pendingLeft = null;
            saveAll(); renderQuiz(); return;
        }
        state._pendingLeft = pairIdx;

        if (state._pendingRight !== null && state._pendingRight !== undefined) {
            const rightIdx = state._pendingRight;
            state._pendingLeft = null;
            state._pendingRight = null;
            checkMatchPair(pairIdx, rightIdx);
            return;
        }
        saveAll(); renderQuiz();
    }

    function matchClickRight(pairIdx) {
        const qs = getQuizState(currentLessonId);
        const origIdx = qs._questionsOrder[qs.currentQuestion];
        const state = qs.questionState[origIdx];
        if (state.matchedPairs.includes(pairIdx)) return;

        if (state._pendingRight === pairIdx) {
            state._pendingRight = null;
            saveAll(); renderQuiz(); return;
        }
        state._pendingRight = pairIdx;

        if (state._pendingLeft !== null && state._pendingLeft !== undefined) {
            const leftIdx = state._pendingLeft;
            state._pendingLeft = null;
            state._pendingRight = null;
            checkMatchPair(leftIdx, pairIdx);
            return;
        }
        saveAll(); renderQuiz();
    }

    function checkMatchPair(leftIdx, rightIdx) {
        const qs = getQuizState(currentLessonId);
        const lesson = allLessons[currentLessonId];
        const origIdx = qs._questionsOrder[qs.currentQuestion];
        const q = lesson.questions[origIdx];
        const state = qs.questionState[origIdx];

        if (leftIdx === rightIdx) {
            state.matchedPairs.push(leftIdx);
            state._pendingLeft = null;
            state._pendingRight = null;
            const total = q.pairs.length;
            if (state.matchedPairs.length === total) {
                state.done = true;
                if (!state.hadError) {
                    qs.score++;
                }
            }
            saveAll();
            renderQuizNavGrid();
            renderQuiz();
            const done = qs.questionState.filter(s => s && s.done).length;
            quizProgressFill.style.width = (done / lesson.questions.length) * 100 + "%";
        } else {
            state.hadError = true;
            state.wrong = true;
            state._pendingLeft = null;
            state._pendingRight = null;
            saveAll();
            flashMatchWrong(leftIdx, rightIdx);
        }
    }

    function flashMatchWrong(leftIdx, rightIdx) {
        const qs = getQuizState(currentLessonId);
        const order = qs._matchOrder[qs._questionsOrder[qs.currentQuestion]];
        const leftPos = order.leftOrder.indexOf(leftIdx);
        const rightPos = order.rightOrder.indexOf(rightIdx);
        const cols = quizContent.querySelectorAll(".match-col");
