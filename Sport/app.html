<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Конструктор курсов — читатель и редактор">
    <meta name="color-scheme" content="light dark">
    <title id="page-title">Курс</title>

    <!-- Anti-FOUC: тема + режим ДО первой отрисовки -->
    <script>
        (function() {
            try {
                var t = localStorage.getItem("kp_course_theme");
                if (t === "dark" || t === "light") {
                    document.documentElement.setAttribute("data-theme", t);
                } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
                var m = localStorage.getItem("kp_app_mode");
                if (m === "reader" || m === "author") {
                    document.documentElement.setAttribute("data-app-mode", m);
                } else {
                    document.documentElement.setAttribute("data-app-mode", "reader");
                }
            } catch (e) {}
        })();
    </script>

    <link rel="stylesheet" href="app.css">
</head>
<body>

<noscript>
    <div style="max-width: 640px; margin: 80px auto; padding: 32px 24px; font-family: sans-serif; line-height: 1.6;">
        <h1 style="margin: 0 0 12px; font-size: 22px;">⚠ JavaScript отключён</h1>
        <p style="margin: 0 0 12px;">Курс не может отобразиться без JavaScript. Включи его в настройках браузера и обнови страницу.</p>
    </div>
</noscript>

<!-- ============================================================
     ТОПБАР — общий
     ============================================================ -->
<div class="topbar" id="app-topbar">
    <div class="left">
        <div class="logo" id="topbar-logo">📚</div>
        <div class="title" id="topbar-title">Курс</div>
    </div>
    <div class="right">
        <div class="mode-switch" id="mode-switch">
            <button type="button" id="mode-btn-reader" data-mode="reader">👁 Читатель</button>
            <button type="button" id="mode-btn-author" data-mode="author">✏️ Редактор</button>
        </div>

        <button class="btn btn-outline print-hide reader-only" onclick="printCurrent()" title="Сохранить в PDF">📄</button>

        <button class="btn btn-outline author-only" onclick="downloadData()" title="Скачать data.js">📤 Скачать</button>
        <button class="btn btn-outline author-only" onclick="reloadFromFile()" title="Откатить к data.js">↻ Откатить</button>
        <button class="btn btn-primary author-only" onclick="saveToFile()">💾 Сохранить</button>

        <button class="btn-icon" onclick="toggleTheme()" title="Сменить тему" id="theme-btn">🌙</button>
    </div>
</div>

<!-- ============================================================
     ЕДИНЫЙ КОРЕНЬ
     ============================================================ -->
<div id="app-root">

    <div class="app-container" id="app-container">

        <!-- ЭКРАН МЕНЮ КУРСА -->
        <div class="screen active" id="screen-menu">
            <div class="screen-header">
                <div>
                    <h1 class="screen-title" id="course-title">Курс</h1>
                    <p class="screen-subtitle">Выбери блок и изучай теорию, проходи тесты или открывай памятки</p>
                </div>
                <button class="btn-icon author-only" onclick="openCourseSettings()" title="Настройки курса" id="course-settings-btn">⚙</button>
            </div>

            <div class="menu-split" id="menu-split">
                <div class="menu-list-col">
                    <div class="menu-search-wrap">
                        <input type="text" class="menu-search" id="menu-search" placeholder="🔍 Поиск блока..." oninput="onMenuSearch()">
                    </div>

                    <!-- Кнопка "Добавить блок" в авторе -->
                    <div class="menu-add-wrap author-only">
                        <div class="dropdown-wrap">
                            <button class="btn btn-outline btn-sm" onclick="toggleDropdown(event, 'add-lesson-menu')">＋ Добавить блок ▾</button>
                            <div class="dropdown-menu" id="add-lesson-menu">
                                <button onclick="closeAllDropdowns(); addLesson('theory')">＋ Теория</button>
                                <button onclick="closeAllDropdowns(); addLesson('quiz')">＋ Тест</button>
                                <button onclick="closeAllDropdowns(); addLesson('memo')">＋ Памятка</button>
                                <button onclick="closeAllDropdowns(); addLesson('glossary')">＋ Глоссарий</button>
                            </div>
                        </div>
                        <div class="dropdown-wrap">
                            <button class="btn-icon" onclick="toggleDropdown(event, 'course-actions-menu')" title="Действия с курсом">⋮</button>
                            <div class="dropdown-menu dropdown-menu-right" id="course-actions-menu">
                                <button onclick="closeAllDropdowns(); importLesson()">📥 Импорт блока</button>
                                <button onclick="closeAllDropdowns(); exportCourse()">📤 Экспорт курса</button>
                                <button onclick="closeAllDropdowns(); importCourse()">📥 Импорт всего курса</button>
                            </div>
                        </div>
                    </div>

                    <div class="menu-list" id="menu-list"></div>
                </div>
                <div class="menu-preview-col">
                    <div class="menu-preview" id="menu-preview"></div>
                </div>
            </div>
        </div>

        <!-- ЭКРАН ТЕОРИИ -->
        <div class="screen" id="screen-lesson">
            <div class="card">
                <div class="card-body">
                    <div class="lesson-header">
                        <div class="lesson-title" id="lesson-title"></div>
                        <div class="header-right">
                            <button class="btn btn-text print-hide" id="back-btn-lesson" onclick="goBack()" style="display:none;">← Назад</button>
                            <button class="btn-icon print-hide reader-only" onclick="printCurrent()" title="Сохранить в PDF">📄</button>
                            <button class="btn btn-text print-hide" onclick="exitToMenu()">← В меню</button>
                        </div>
                    </div>
                    <div class="progress-bar" style="margin-top:20px;"><div class="progress-fill" id="progress-fill"></div></div>
                </div>
            </div>

            <div class="lesson-layout">
                <div class="lesson-main">
                    <div class="card">
                        <div class="card-body" id="slide-content"></div>
                    </div>
                </div>
                <aside class="lesson-sidebar">
                    <button class="help-btn" onclick="openHelp()">Справка</button>
                    <h3 id="topic-list-title">Содержание</h3>
                    <nav class="topic-list" id="topic-list"></nav>
                    <!-- Кнопка "＋ Слайд" появляется в авторе из JS -->
                </aside>
            </div>
        </div>

        <!-- ЭКРАН ТЕСТА -->
        <div class="screen" id="screen-quiz">
            <div class="card">
                <div class="card-body">
                    <div class="lesson-header">
                        <div class="lesson-title" id="quiz-title"></div>
                        <div class="header-right">
                            <span class="timer print-hide" id="quiz-timer">00:00</span>
                            <button class="btn btn-text print-hide" id="back-btn-quiz" onclick="goBack()" style="display:none;">← Назад</button>
                            <button class="btn btn-outline print-hide author-only" onclick="openQuizEditor()" title="Редактировать вопросы">✎ Редактировать</button>
                            <button class="btn-icon print-hide reader-only" onclick="printCurrent()" title="Сохранить в PDF">📄</button>
                            <button class="btn btn-text print-hide" onclick="exitToMenu()">← В меню</button>
                        </div>
                    </div>
                    <div class="progress-bar" style="margin-top:20px;"><div class="progress-fill" id="quiz-progress-fill"></div></div>
                </div>
            </div>

            <div class="quiz-layout">
                <div class="quiz-main">
                    <div class="card">
                        <div class="card-body" id="quiz-content"></div>
                    </div>
                </div>
                <aside class="quiz-sidebar">
                    <button class="help-btn" onclick="openHelp()">Справка</button>
                    <h3>Навигация</h3>
                    <div class="quiz-nav-grid" id="quiz-nav-grid"></div>
                </aside>
            </div>
        </div>

        <!-- ЭКРАН ПАМЯТКИ -->
        <div class="screen" id="screen-memo">
            <div class="memo-screen-header">
                <h1 class="memo-screen-title" id="memo-title"></h1>
                <div class="header-right">
                    <button class="btn btn-text print-hide" id="back-btn-memo" onclick="goBack()" style="display:none;">← Назад</button>
                    <button class="btn-icon print-hide" onclick="openHelp()" title="Справка">📖</button>
                    <button class="btn-icon print-hide reader-only" onclick="printCurrent()" title="Сохранить в PDF">📄</button>
                    <button class="btn btn-text print-hide" onclick="exitToMenu()">← В меню</button>
                </div>
            </div>
            <div class="memo-grid" id="memo-grid"></div>
        </div>

        <!-- ЭКРАН ГЛОССАРИЯ -->
        <div class="screen" id="screen-glossary">
            <div class="card">
                <div class="card-body">
                    <div class="lesson-header">
                        <div class="lesson-title" id="glossary-title"></div>
                        <div class="header-right">
                            <button class="btn btn-text print-hide" id="back-btn-glossary" onclick="goBack()" style="display:none;">← Назад</button>
                            <button class="btn-icon print-hide" onclick="openHelp()" title="Справка">📖</button>
                            <button class="btn-icon print-hide reader-only" onclick="printCurrent()" title="Сохранить в PDF">📄</button>
                            <button class="btn-icon print-hide author-only" onclick="exportGlossaryCsv()" title="Экспорт глоссария в CSV">📊</button>
                            <button class="btn btn-text print-hide" onclick="exitToMenu()">← В меню</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glossary-layout">
                <aside class="glossary-sidebar">
                    <div class="glossary-search-wrap">
                        <input type="text" class="glossary-search" id="glossary-search" placeholder="🔍 Поиск..." oninput="onGlossarySearch()">
                    </div>
                    <nav class="glossary-list" id="glossary-list"></nav>
                </aside>
                <div class="glossary-main">
                    <div class="card">
                        <div class="card-body" id="glossary-content"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- МОДАЛКА СПРАВКИ -->
    <div class="help-overlay" id="help-overlay" onclick="closeHelpIfOutside(event)">
        <div class="help-modal" id="help-modal">
            <button class="help-close" onclick="closeHelp()" title="Закрыть (Esc)">✕</button>
            <div id="help-body"></div>
        </div>
    </div>

    <!-- МОДАЛКА CSV (глоссарий / тест) -->
    <div class="csv-overlay" id="csv-overlay" onclick="closeCsvIfOutside(event)">
        <div class="csv-modal" id="csv-modal">
            <button class="csv-close" onclick="closeCsvModal()" title="Закрыть (Esc)">✕</button>
            <div id="csv-modal-body"></div>
        </div>
    </div>

    <!-- МОДАЛКА РЕДАКТОРА ТЕСТА -->
    <div class="quiz-editor-overlay" id="quiz-editor-overlay" onclick="closeQuizEditorIfOutside(event)">
        <div class="quiz-editor-modal" id="quiz-editor-modal">
            <button class="quiz-editor-close" onclick="closeQuizEditor()" title="Закрыть (Esc)">✕</button>
            <div id="quiz-editor-body"></div>
        </div>
    </div>

    <!-- УНИВЕРСАЛЬНАЯ МОДАЛКА (для редактирования названий, описания, обложки) -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModalIfOutside(event)">
        <div class="modal-card" id="modal-card">
            <button class="modal-close" onclick="closeModal()" title="Закрыть (Esc)">✕</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- СТАТУСНАЯ ПЛАШКА (для автора) -->
    <div class="status" id="status"></div>

</div><!-- /#app-root -->

<script src="data.js"></script>
<script src="shared.js"></script>
<script src="reader.js"></script>
<script src="app.js"></script>

</body>
</html>
